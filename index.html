        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }

<script>
const mockData120 = [
{q: "Câu 1: Bạn đang lái xe và gặp tình huống có người đi bộ phía sau xe tải. Trong khi xe tải lớn phía trước đang che khuất hoàn toàn tầm nhìn bên phải của bạn, người đi bộ bất ngờ bước ra từ sau xe tải đó. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Chủ động rà phanh trước khi vượt qua điểm khuất, hạ tốc độ sâu, giữ khoảng cách an toàn và ưu tiên nhường đường.[cite: 2]", "B. Tăng tốc thật nhanh để vượt qua xe tải và tránh người đi bộ.[cite: 2]", "C. Giữ tốc độ và bấm còi liên tục để cảnh báo người đi bộ.[cite: 2]", "D. Dừng lại đột ngột ngay giữa đường để chờ người đi bộ đi sang hết.[cite: 2]"], a: 0},
{q: "Câu 2: Bạn đang lái xe qua khu vực có dải phân cách, nơi thường xuyên có người băng qua đường không đúng nơi quy định. Bất ngờ, bạn thấy một người đi bộ bước xuống phần đường xe chạy từ phía dải phân cách. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Giảm tốc độ từ sớm, quan sát kỹ hướng di chuyển của người đi bộ và dừng lại an toàn nếu họ vẫn tiếp tục sang đường.[cite: 2]", "B. Tăng tốc để vượt qua trước khi người đi bộ kịp sang đến làn đường của mình.[cite: 2]", "C. Tiếp tục giữ nguyên tốc độ và chỉ nhấn còi để cảnh báo người đi bộ tránh ra.[cite: 2]", "D. Dừng lại đột ngột ngay lập tức dù xe phía sau đang bám sát để nhường đường.[cite: 2]"], a: 0},
{q: "Câu 3: Phía trước bạn là một chiếc xe buýt đang dừng tại điểm để đón trả khách. Bạn nhận thấy xe phía trước đang phanh lại hoặc có khả năng có người đi bộ bất ngờ bước ra từ phía đầu xe buýt. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn còi liên tục và tăng tốc để vượt qua xe buýt thật nhanh.[cite: 2]", "B. Giữ khoảng cách rộng hơn bình thường với xe buýt, chủ động giảm tốc độ và quan sát kỹ hai bên đầu xe buýt để phòng ngừa người đi bộ băng ngang.[cite: 2]", "C. Tiếp tục di chuyển sát xe buýt để không cho người đi bộ có khoảng trống đi ra.[cite: 2]", "D. Dừng lại hằn phía sau xe buýt và chờ cho đến khi xe buýt chuyển bánh mới đi tiếp.[cite: 2]"], a: 1},
{q: "Câu 4: Bạn đang di chuyển trên đường chính và nhận thấy có giao lộ hoặc đường nhánh nhỏ bên phải. Lúc này, đầu một chiếc xe con nhô ra từ đường nhánh và có xu hướng muốn nhập vào làn đường chính của bạn. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Tăng tốc và bám sát xe phía trước để không cho xe con từ đường nhánh nhập làn.[cite: 2]", "B. Tiếp tục di chuyển bình thường vì xe mình ở đường chính.[cite: 2]", "C. Chủ động nhả ga sớm, rà phanh nhẹ để giảm tốc độ và sẵn sàng dừng lại nếu xe con kia vẫn tiếp tục tiến ra đường chính.[cite: 2]", "D. Bấm còi thật lớn và giữ nguyên tốc độ để cảnh báo xe con không được tiến ra.[cite: 2]"], a: 2},
{q: "Câu 5: Một người điều khiển xe máy đi phía trước đang bám sát vạch phân làn và có biểu hiện tay lái không ổn định, liên tục chao đảo. Bất ngờ, xe máy này đột ngột lấn sang làn đường của bạn mà không có tín hiệu xi nhan. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Tăng tốc để vượt qua xe máy nhằm tránh rắc rối.[cite: 2]", "B. Giữ nguyên tốc độ, áp sát xe máy và bấm còi để nhắc nhở tài xế đi đúng làn.[cite: 2]", "C. Chủ động giảm tốc độ, giữ khoảng cách an toàn và hơi lệch sang phía an toàn để tránh va chạm.[cite: 2]", "D. Phanh gấp ngay lập tức chờ xe máy đi qua.[cite: 2]"], a: 2},
{q: "Câu 6: Thông qua gương chiếu hậu, bạn quan sát thấy một chiếc xe buýt phía sau đang tăng tốc nhanh và bám sát đuôi xe bạn. Ngay sau đó, tài xế xe buýt lấn dần sang làn đường của bạn để tìm cách vượt lên trong không gian hẹp. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Tăng tốc độ để ngăn cản, không cho xe buýt có cơ hội vượt qua.[cite: 2]", "B. Giảm tốc độ nhẹ để tạo khoảng trống an toàn, giữ vững hướng lái và chú ý quan sát gương.[cite: 2]", "C. Đánh lái liên tục từ trái sang phải để chặn hướng tiến của xe buýt.[cite: 2]", "D. Đạp phanh nhấp nhả để buộc xe buýt phía sau phải đi chậm lại.[cite: 2]"], a: 1},
{q: "Câu 7: Bạn đang tiến vào khu dân cư đông đúc, phía trước là vạch kẻ đường dành cho người đi bộ. Chiếc xe phía trước đột ngột sáng đèn phanh vì có người đi bộ đang chuẩn bị bước xuống lòng đường để qua đường. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Đánh lái sang làn bên cạnh để vượt xe phía trước và tiếp tục hành trình.[cite: 2]", "B. Giữ nguyên tốc độ và lách qua khoảng trống giữa xe phía trước và người đi bộ.[cite: 2]", "C. Hạ tốc độ, duy trì khoảng cách an toàn và chuẩn bị dừng hẳn nếu người đi bộ đi sang đường.[cite: 2]", "D. Bấm còi liên tục để yêu cầu người đi bộ nhường đường cho xe cơ giới.[cite: 2]"], a: 2},
{q: "Câu 8: Tại đoạn đường có một ngõ khuất bên phải, bạn phát hiện bóng một người đi xe đạp đang lao ra từ ngõ với tốc độ khá nhanh mà không có dấu hiệu quan sát đường chính. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Tăng tốc để vượt qua điểm giao cắt trước khi xe đạp lao ra.[cite: 2]", "B. Giữ nguyên tốc độ và bấm còi liên tục để người xe đạp nhường đường.[cite: 2]", "C. Quan sát hai bên, chủ động giảm tốc độ sâu và giữ khoảng cách phòng ngừa va chạm ngang.[cite: 2]", "D. Đánh lái gấp sang làn ngược chiều để tránh người đi xe đạp.[cite: 2]"], a: 2},
{q: "Câu 9: Một chiếc xe con phía trước đang di chuyển không ổn định, tài xế bất ngờ nhấn ga tăng tốc và lấn sang phần đường ngược chiều để cố gắng vượt một xe khác tại đoạn đường không an toàn. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Tăng tốc bám theo để cùng vượt với xe phía trước.[cite: 2]", "B. Không tăng tốc theo, giảm ga và giữ khoảng cách an toàn để tránh va chạm dồn xe.[cite: 2]", "C. Nháy đèn pha và bấm còi để xe phía nhanh chóng hoàn thành việc vượt.[cite: 2]", "D. Phanh gấp và tránh xa để giữ an toàn tuyệt đối với xe đang vượt ẩu.[cite: 2]"], a: 1},
{q: "Câu 10: Bạn đang tiến tới một giao lộ phía bên trái có tầm nhìn hạn chế do tường rào. Đột ngột một chiếc xe con từ đường nhánh tiến ra và có dấu hiệu cắt ngang qua hướng di chuyên của bạn để sang đường. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Giữ nguyên tốc độ vì bạn đang lưu thông trên đường ưu tiên.[cite: 2]", "B. Tăng tốc để nhanh chóng vượt qua đầu xe con trước khi họ lao ra giữa đường.[cite: 2]", "C. Đánh lái gấp sang phải để né tránh va chạm.[cite: 2]", "D. Chủ động giảm tốc độ, đặt chân vào bàn đạp phanh và sẵn sàng dừng lại nếu xe con không nhường.[cite: 2]"], a: 3},
{q: "Câu 11: Phía trước bạn là một chiếc xe bồn trộn bê tông đang chiếm phần lớn diện tích mặt đường. Tài xế xe bê tông bắt đầu lấn dần sang làn đường của bạn để tránh một vật cản bên lề đường của họ. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga mạnh để vượt qua xe bê tông trước khi bị ép vào lề.[cite: 2]", "B. Đi song song với xe bê tông để yêu cầu họ giữ đúng làn đường.[cite: 2]", "C. Chủ động giảm tốc độ và nhường đường, ép xe về phía an toàn bên phải.[cite: 2]", "D. Bám sát đuôi xe bê tông và bấm còi liên tục để phản đối.[cite: 2]"], a: 2},
{q: "Câu 12: Chiếc xe con đang di chuyển ngay phía trước bạn bật tín hiệu xi nhan trái và bắt đầu rà phanh, chuẩn bị đánh lái để rẽ vào một con ngõ phía bên trái. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Tăng tốc và tìm cách vượt lên phía bên trái của xe đang rẽ.[cite: 2]", "B. Giữ khoảng cách an toàn lớn hơn, chủ động giảm tốc độ để tránh tình huống cắt đầu.[cite: 2]", "C. Bám sát đuôi xe phía trước và nhấn còi hối thúc họ rẽ nhanh hơn.[cite: 2]", "D. Phanh gấp ngay khi thấy đèn xi nhan của xe phía trước bật sáng để đảm bảo an toàn.[cite: 2]"], a: 1},
{q: "Câu 13: Bạn quan sát thấy một người đi xe đạp đang di chuyển sát mép lề đường bên phải nhưng liên tục ngoái đầu lại phía sau và có xu hướng muốn rẽ trái để sang đường. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Bấm còi thật mạnh để người đi xe đạp giật mình và dừng lại.[cite: 2]", "B. Tăng tốc vượt qua thật nhanh để người đi xe đạp không có cơ hội sang đường.[cite: 2]", "C. Hạ tốc độ từ sớm, không bấm còi đột ngột, giữ khoảng cách để người đi xe đạp sang đường an toàn.[cite: 2]", "D. Phanh gấp, dừng lại hắn để nhường đường cho xe đạp.[cite: 2]"], a: 2},
{q: "Câu 14: Bạn đang lái xe vào một đoạn đường hẹp, vừa lúc đó ở phía đối diện có một xe khác cũng đang tiến vào, khiến không gian còn lại không đủ để hai xe tránh nhau một cách thoải mái. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc để chiếm đường đi trước, buộc xe đối diện phải dừng lại.[cite: 2]", "B. Phanh gấp, dừng hẳn xe lại chờ xe đối diện đi qua.[cite: 2]", "C. Giữ nguyên tốc độ và đi sát vào giữa đường để ép xe đối diện phải lùi lại.[cite: 2]", "D. Giảm tốc độ về mức an toàn, chủ động nhường đường nếu cần thiết để tránh xung đột giao thông.[cite: 2]"], a: 3},
{q: "Câu 15: Khi đang di chuyển ở vận tốc ổn định phía sau một chiếc xe tải, bất ngờ bạn thấy đèn phanh của xe tải đỏ rực đột ngột, báo hiệu một tình huống dừng khẩn cấp phía trước. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Đánh lái nhanh sang làn bên cạnh để tránh va chạm với đuôi xe tải.[cite: 2]", "B. Giữ nguyên tốc độ và chuẩn bị rẽ vào lề đường bên phải.[cite: 2]", "C. Đạp phanh dứt khoát nhưng có kiểm soát, duy trì khoảng cách an toàn để tránh va chạm liên hoàn.[cite: 2]", "D. Phanh cháy lốp và dừng xe ngay lập tức mà không cần quan sát gương hậu.[cite: 2]"], a: 2},
{q: "Câu 16: Tại một giao lộ phía bên trái bị che khuất tầm nhìn bởi cây cối, bạn thấy đầu một chiếc xe từ đường nhánh đang nhô ra và tiến rất gần vào phần đường chính bạn đang đi. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Tăng tốc để nhanh chóng thoát khỏi khu vực giao lộ.[cite: 2]", "B. Giảm tốc độ, quan sát kỹ vào phía trong đường nhánh và sẵn sàng dừng xe.[cite: 2]", "C. Bấm còi hối thúc liên tục để xe từ đường nhánh phải dừng lại nhường đường.[cite: 2]", "D. Bám sát vào đuôi xe đi trước để cùng nhau vượt qua giao lộ.[cite: 2]"], a: 1},
{q: "Câu 17: Qua gương chiếu hậu, bạn thấy một chiếc xe buýt phía sau đang lao tới với tốc độ cao, lấn sang làn đường ngược chiều để vượt xe bạn trong khi có xe đi đối diện đang đến gần. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc để không cho xe buýt có cơ hội vượt lên.[cite: 2]", "B. Đánh lái sang trái để ép xe buýt không được lấn làn vượt ẩu.[cite: 2]", "C. Chủ động giảm tốc độ để tránh tình huống đối đầu trực diện, giữ hướng xe ổn định.[cite: 2]", "D. Phanh gấp ngay giữa đường để phản đối hành vi của xe buýt.[cite: 2]"], a: 2},
{q: "Câu 18: Bạn đang lái xe trên phố và phát hiện một chiếc xe con đang đỗ sát lề đường bên phải. Khi xe bạn vừa tiến đến gần, cánh cửa phía lái của chiếc xe đó bất ngờ mở ra. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Tăng tốc độ để lướt qua thật nhanh trước khi cánh cửa mở rộng hoàn toàn.[cite: 2]", "B. Giữ nguyên tốc độ, đi sát vào cửa xe và bấm còi để cảnh báo người trong xe.[cite: 2]", "C. Duy trì khoảng cách thân xe rộng với hàng xe đang đỗ và chủ động giảm tốc độ khi đi qua.[cite: 2]", "D. Phanh gấp và dừng chờ xe đóng cửa rồi mới đi qua.[cite: 2]"], a: 2},
{q: "Câu 19: Quan sát phía bên kia đường (chiều ngược lại), bạn thấy một chiếc xe đang đỗ nhưng có ánh đèn xi nhan hoặc chuyên động rung rinh báo hiệu có người chuẩn bị mở cửa hoặc bước ra đường. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Tập trung nhìn vào khoảng trống phía trước xe mình.[cite: 2]", "B. Tăng tốc độ để nhanh chóng đi qua đoạn đường có xe đỗ đó.[cite: 2]", "C. Quan sát đa chiều cả hai phía, chủ động hạ tốc độ đề phòng cửa mở hoặc người băng qua đường.[cite: 2]", "D. Bấm còi để cảnh báo người ở chiếc xe bên kia đường.[cite: 2]"], a: 2},
{q: "Câu 20: Bạn đang lái xe trong khu vực trong phố, với nhiều xe ô tô đỗ san sát hai bên đường. Đột ngột, một cánh cửa xe bên đường mở toang ngay trước hướng di chuyển của xe bạn. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Giữ tốc độ và đánh lái gấp sang làn bên cạnh để tránh va chạm.[cite: 2]", "B. Duy trì tốc độ chậm, giữ khoảng cách an toàn với hai bên và sẵn sàng phanh dừng.[cite: 2]", "C. Bám sát xe phía trước và nhấn còi không ngừng để yêu cầu đường đi.[cite: 2]", "D. Dừng xe đột ngột để chờ xe bên đường đóng cửa rồi mới di chuyển.[cite: 2]"], a: 1},
{q: "Câu 21: Bạn đang lưu thông trên đường thì thấy chiếc xe phía trước dừng lại khá lâu giữa làn đường. Bất ngờ, đèn lùi của xe đó bật sáng và xe bắt đầu lùi thẳng về phía đầu xe bạn. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc và lách nhanh sang làn bên cạnh để tránh.[cite: 2]", "B. Bấm còi liên tục và bám sát đuôi xe phía trước để buộc họ dừng lùi.[cite: 2]", "C. Dừng xe lại ở khoảng cách an toàn, giữ khoảng trống đủ để xử lý tình huống.[cite: 2]", "D. Quan sát phía sau và lùi xe đến khi xe phía trước dừng lại.[cite: 2]"], a: 2},
{q: "Câu 22: Tại một ngã tư lớn, có một chiếc xe khách 16 chỗ đang chờ và bắt đầu từ từ tiến ra để chiếm làn đường chính. Do thân xe dài và điểm mù lớn, tài xế có thể không quan sát thấy xe bạn. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Tăng tốc và nháy đèn pha để ép xe 16 chỗ phải dừng lại nhường đường.[cite: 2]", "B. Chủ động giảm tốc độ từ sớm vì xe lớn khó quan sát, sẵn sàng nhường đường.[cite: 2]", "C. Bấm còi liên tục và đi sát vào đầu xe 16 chỗ để khẳng định ưu tiên.[cite: 2]", "D. Đánh lái sang phần đường đối diện, tăng tốc để vượt qua xe khách.[cite: 2]"], a: 1},
{q: "Câu 23: Một chiếc xe tải đang dừng đỗ trái phép giữa đường làm che khuất hoàn toàn tầm nhìn phía trước, khiến các phương tiện đi trước bạn phải lấn sang làn ngược chiều để vượt qua. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Giữ tốc độ, bám đuôi xe phía trước để cùng vượt qua xe tải thật nhanh.[cite: 2]", "B. Tuyệt đối không vượt ngay, giảm tốc độ và quan sát kỹ phía trước trước khi quyết định.[cite: 2]", "C. Nháy đèn pha và bấm còi liên tục để yêu cầu xe tải phải di chuyển đi nơi khác.[cite: 2]", "D. Đánh lái sang làn bên cạnh để không cho các xe ngược chiều chen vào.[cite: 2]"], a: 1},
{q: "Câu 24: Xe vệ sinh môi trường đang dừng làm việc giữa đường, có nhân viên đang đi lại xung quanh để thu gom rác khiến xe phía trước bạn phải chuyển làn đột ngột. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Tăng tốc để vượt qua cả xe phía trước lẫn xe môi trường.[cite: 2]", "B. Bấm còi để nhân viên môi trường phải nhanh chóng dẹp vào lề.[cite: 2]", "C. Giảm tốc độ và giữ khoảng cách an toàn để tránh các tình huống va chạm bất ngờ.[cite: 2]", "D. Phanh gấp ngay khi thấy xe phía trước bật xi nhan chuyển làn.[cite: 2]"], a: 2},
{q: "Câu 25: Chiếc xe buýt đang đậu tại điểm dừng bất ngờ bật tín hiệu xi nhan trái và bắt đầu từ từ chuyển bánh lấn ra làn đường của bạn để nhập làn. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc để ngăn cản xe buýt không được nhập làn trước mặt xe mình.[cite: 2]", "B. Giữ nguyên tốc độ và bấm còi mạnh để cảnh báo xe buýt phải nhường đường chính.[cite: 2]", "C. Chủ động giảm tốc độ để tạo một khoảng trống an toàn cho xe buýt nhập làn.[cite: 2]", "D. Bám sát đuôi xe đi trước không cho xe buýt lấn sang làn của bạn.[cite: 2]"], a: 2},
{q: "Câu 26: Bạn nhìn thấy biển báo khu vực đang thi công từ xa và xuất hiện các cọc tiêu, rào chắn cùng công nhân đang làm việc ngay trên mặt đường. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Tăng tốc độ để nhanh chóng thoát khỏi khu vực đầy bụi bặm của công trường.[cite: 2]", "B. Đánh lái nhanh để lách qua các xe khác và tiếp tục hành trình.[cite: 2]", "C. Đánh lái liên tục giữa các cọc tiêu để tìm đường đi ngắn nhất.[cite: 2]", "D. Giảm tốc độ sâu, di chuyển đúng theo làn đường tạm và tuân thủ người điều tiết.[cite: 2]"], a: 3},
{q: "Câu 27: Bạn đang dừng xe chờ đèn đỏ tại một giao lộ. Ngay khi đèn tín hiệu giao thông vừa chuyển sang màu xanh, bạn quan sát thấy vẫn còn phương tiện chưa thoát hết khỏi giao lộ. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Không di chuyển ngay, quan sát kỹ an toàn hai bên rồi mới từ từ tăng tốc.[cite: 2]", "B. Bấm còi liên tục để hối thúc các xe phía trước di chuyển nhanh hơn.[cite: 2]", "C. Nhấn ga tăng tốc để bắt kịp nhịp giao thông và không làm xe sau khó chịu.[cite: 2]", "D. Chậm rãi đi giao lộ an toàn mặc kệ các xe phía sau bấm còi nhắc nhở.[cite: 2]"], a: 0},
{q: "Câu 28: Xuất hiện biển cảnh báo đoạn đường trơn trượt do trời mưa, bạn thấy mặt đường có vẻ bóng loáng và xe đi trước đang có dấu hiệu sàng đuôi khi rà phanh. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Tăng tốc độ để nhanh chóng thoát khỏi đoạn đường nguy hiểm này.[cite: 2]", "B. Đạp phanh thật mạnh mỗi khi cảm thấy xe có dấu hiệu không bám đường.[cite: 2]", "C. Bám sát vào vết bánh xe của phương tiện đi trước để tăng độ bám.[cite: 2]", "D. Hạ ga từ sớm, tuyệt đối không phanh gấp và duy trì khoảng cách an toàn lớn hơn.[cite: 2]"], a: 3},
{q: "Câu 29: Đoạn đường phía trước bị xuống cấp nghiêm trọng với nhiều ổ gà, ổ voi. Chiếc xe phía trước đang phải liên tục phanh và đánh lái ngoằn ngoèo để né tránh các hố sâu. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Đánh lái theo xe phía trước để vượt qua đoạn đường xấu.[cite: 2]", "B. Chủ động hạ tốc độ và giữ hướng lái thẳng ổn định, tránh các pha đánh lái đột ngột.[cite: 2]", "C. Nhấn ga để lướt qua các ổ gà thật nhanh nhằm giảm độ rung chấn cho xe.[cite: 2]", "D. Bám sát đuôi xe phía trước để đi qua đường xấu.[cite: 2]"], a: 1},
{q: "Câu 30: Khi đang di chuyển qua khu vực đường nông thôn không có rào chắn, bạn phát hiện một con bò đang đứng thong dong ngay giữa phân đường dành cho xe chạy. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Bấm còi liên tục để con bỏ sợ hãi mà chạy khỏi đường.[cite: 2]", "B. Giữ nguyên tốc độ và đánh lái vòng qua con bò với khoảng cách hẹp.[cite: 2]", "C. Giảm tốc độ sâu, có thể bấm còi nhẹ để cảnh báo động vật tránh ra.[cite: 2]", "D. Phanh gấp và dừng xe lại ngay sát vị trí con bò đang đứng.[cite: 2]"], a: 2},
{q: "Câu 31: Bạn quan sát thấy một đàn vật nuôi đang tập trung bên lề đường và một vài con bắt đầu mất kiểm soát, chạy băng cắt qua đường ngay trước mũi xe bạn. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Giữ tốc độ và bấm còi để ép đàn vật nuôi phải dừng lại chờ xe qua.[cite: 2]", "B. Bấm còi liên tục để xua hối thúc đàn gia súc nhanh chóng ra khỏi quốc lộ.[cite: 2]", "C. Giảm tốc độ đến mức dừng hẳn nếu cần, không cố tình tăng tốc để ép qua.[cite: 2]", "D. Phanh gấp tại con vật đang đi đầu đàn để buộc cả đàn phải chạy nhanh hơn.[cite: 2]"], a: 2},
{q: "Câu 32: Bạn đang lái xe qua khu dân cư gần trường học, bất ngờ một đứa trẻ từ vĩa hè chạy vụt xuống lòng đường mà không quan sát xung quanh. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn còi liên tục và giữ nguyên tốc độ để đứa trẻ tự sợ mà quay lại.[cite: 2]", "B. Tăng tốc để vượt qua trước khi đứa trẻ chạy ra đến giữa làn đường.[cite: 2]", "C. Hạ tốc độ sớm nhất có thể, đặt chân vào phanh và sẵn sàng dừng để nhường đường.[cite: 2]", "D. Đánh lái gấp sang làn đường ngược chiều để tránh va chạm với đứa trẻ.[cite: 2]"], a: 2},
{q: "Câu 33: Ven đường có một nhóm trẻ em đang nô đùa, chạy nhảy sát mép đường. Có nguy cơ cao một trong số trẻ sẽ chạy bất ngờ ra lòng đường để đuổi theo bóng hoặc bạn bè. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Giữ nguyên tốc độ ổn định và chỉ tập trung nhìn thẳng về phía trước.[cite: 2]", "B. Bấm còi thật to để nhóm trẻ em sợ mà đi vào trong.[cite: 2]", "C. Tăng tốc để mau chóng đi qua khu vực có trẻ em vui chơi.[cite: 2]", "D. Di chuyển với tốc độ rất chậm, luôn giữ chân vào bàn đạp phanh để xử lý kịp thời.[cite: 2]"], a: 3},
{q: "Câu 34: Một chiếc xe khách chạy tuyến cố định từ phía sau đang liên tục nháy đèn, bấm còi và bắt đầu lấn hẳn sang làn của bạn để tìm cách vượt lên. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Tăng tốc độ không cho xe khách vượt ẩu.[cite: 2]", "B. Đánh lái sang trái để chặn đường, không cho xe khách có khe hở để vượt.[cite: 2]", "C. Chủ động giảm tốc độ nhẹ, giữ hướng xe ổn định để xe khách vượt qua an toàn.[cite: 2]", "D. Phanh gấp đột ngột để cảnh cáo tài xế xe khách phía sau.[cite: 2]"], a: 2},
{q: "Câu 35: Chiếc xe khách di chuyển phía trước bạn bất ngờ đánh lái gấp sang làn đường bên cạnh để né tránh một vật cản lớn rơi trên đường mà bạn chưa nhìn thấy. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga để bám theo xe khách sang làn đường mới.[cite: 2]", "B. Giữ nguyên tốc độ và tiếp tục đi thẳng theo hành trình.[cite: 2]", "C. Rà phanh giảm tốc và tăng khoảng cách an toàn với xe khách để tránh bị ép.[cite: 2]", "D. Bấm còi liên tục để phản đối hành vi chuyển làn không quan sát của xe khách.[cite: 2]"], a: 2},
{q: "Câu 36: Tại đoạn đường nông thôn có nhiều ngõ nhỏ khuất tầm nhìn, bạn phát hiện một chiếc xe máy lao ra từ ngõ với tốc độ cao mà không hề giảm tốc độ. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Tăng tốc để lướt qua nhanh trước khi xe máy kịp chiếm phần đường của bạn.[cite: 2]", "B. Giữ nguyên tốc độ và bấm còi mạnh để xe máy phải tự hãm phanh.[cite: 2]", "C. Luôn chú ý quan sát hai bên ngõ nhỏ và chủ động giảm tốc độ từ xa.[cite: 2]", "D. Phanh gấp để dừng lại chờ xe máy đi qua.[cite: 2]"], a: 2},
{q: "Câu 37: Trong khu dân cư, bạn thấy một người đi xe đạp từ trong ngõ nhỏ từ từ đi ra đường chính nhưng mặt lại ngoảnh đi hướng khác, thiếu quan sát phương tiện. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Giữ nguyên tốc độ vì xe đạp từ đường không ưu tiên phải nhường bạn.[cite: 2]", "B. Chủ động giảm tốc độ sâu vì người đi xe đạp thường khó kiểm soát tay lái.[cite: 2]", "C. Tăng tốc và bấm còi liên tục để người xe đạp giật mình mà dừng lại.[cite: 2]", "D. Đánh lái gấp sang làn đường đối diện để tránh người đi xe đạp.[cite: 2]"], a: 1},
{q: "Câu 38: Bạn đang di chuyển sau một chiếc xe tải lớn che khuất tầm nhìn, bất ngờ một chiếc xe máy chui tọt ra từ phía sau đuôi xe tải và lấn thẳng sang làn đường của bạn. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Bám sát đuôi xe tải để không tạo khoảng trống cho xe máy lách vào.[cite: 2]", "B. Tăng tốc để xe máy phải quay trở lại phía sau xe tải.[cite: 2]", "C. Phanh gấp ngay khi thấy bóng dáng xe máy bắt đầu nhô ra.[cite: 2]", "D. Giữ khoảng cách lớn với xe tải, hạ tốc độ và sẵn sàng xử lý tình huống bất ngờ.[cite: 2]"], a: 3},
{q: "Câu 39: Tại một giao lộ rộng không có đèn tín hiệu, một chiếc xe tải chở hàng nặng đang từ từ băng ngang qua đường ngay trước tầm mắt bạn. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Giảm tốc độ và chủ động nhường đường vì xe lớn chở nặng rất khó dừng gấp.[cite: 2]", "B. Nhấn ga tăng tốc để cố gắng lách qua trước đầu xe tải.[cite: 2]", "C. Bấm còi liên tục yêu cầu xe tải phải dừng lại ngay giữa giao lộ.[cite: 2]", "D. Bám sát vào phía đuôi xe tải để tranh thủ đi qua giao lộ.[cite: 2]"], a: 0},
{q: "Câu 40: Tầm nhìn phía trước của bạn bị một chiếc xe tải đang đỗ che khuất, bất ngờ có một người đi xe máy đi ngược chiều đi ra từ phía đầu chiếc xe tải đó. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Rà nhẹ chân phanh trước khi vượt qua xe tải và duy trì khoảng cách an toàn.[cite: 2]", "B. Bấm còi liên tục để xe máy ngược chiều phải dạt vào lề.[cite: 2]", "C. Nhấn ga tăng tốc để vượt qua đoạn khuất của xe tải thật nhanh.[cite: 2]", "D. Phanh gấp ngay lập tức khi phát hiện có bóng xe máy.[cite: 2]"], a: 0},
{q: "Câu 41: Tại giao lộ phía trước, chiếc xe con đang di chuyển bỗng nhiên tăng tốc đột ngột và đánh lái rẽ trái với tốc độ rất cao ngay trước mặt xe bạn. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Hạ tốc độ, giữ khoảng cách an toàn và chú ý quan sát hướng di chuyển của xe.[cite: 2]", "B. Nhấn còi liên tục để cảnh báo cho xe con.[cite: 2]", "C. Đánh lái sang làn bên cạnh để vượt qua trước khi xe con hoàn thành củ rẽ.[cite: 2]", "D. Phanh gấp ngay lập tức để tránh va chạm.[cite: 2]"], a: 0},
{q: "Câu 42: Phương tiện phía trước bật tín hiệu xi nhan rẽ trái và bạn nhận thấy chiếc xe máy đó bắt đầu chuyển hướng dẫn sang làn đường của bạn. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Tăng tốc để cố gắng vượt xe máy từ phía bên trái trước khi họ rẽ.[cite: 2]", "B. Bấm còi hối thúc xe máy phải nhanh chóng thực hiện thao tác rẽ.[cite: 2]", "C. Giảm tốc độ, duy trì khoảng cách an toàn và theo dõi sát hướng rẽ của xe máy.[cite: 2]", "D. Bám sát xe máy để gây áp lực buộc họ phải rẽ nhanh hơn.[cite: 2]"], a: 2},
{q: "Câu 43: Trong khu vực có biển báo công trường, một chiếc xe tải đi trước đang phải đánh lái chuyển hướng để tránh các đống vật liệu thi công lấn ra đường. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc để vượt xe tải trước khi họ kịp chuyển sang làn của bạn.[cite: 2]", "B. Bám sát đuôi xe tải để di chuyển cùng với họ.[cite: 2]", "C. Giảm tốc độ, giữ khoảng cách an toàn và quan sát kỹ tình huống phía trước.[cite: 2]", "D. Bấm còi và chạy vào khu vực đang thi công để vượt xe tải.[cite: 2]"], a: 2},
{q: "Câu 44: Trên đoạn đường hẹp, chiếc xe con phía trước bất ngờ tăng tốc và lấn hẳn sang làn ngược chiều để vượt âu một xe tải khác. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Hạ tốc độ, giữ khoảng cách an toàn và kiên trì đi đúng phần đường của mình.[cite: 2]", "B. Bấm còi liên tục để cảnh báo các xe đi ngược chiều thay cho xe con.[cite: 2]", "C. Nhấn ga tăng tốc để bám theo xe con cùng thực hiện pha vượt ẩu.[cite: 2]", "D. Phanh gấp, dừng ngay để tránh xa hiện trường.[cite: 2]"], a: 0},
{q: "Câu 45: Gương chiếu hậu cho thấy một chiếc xe tải phía sau đang tăng tốc nhanh và bắt đầu lấn sang làn đường của bạn để thực hiện việc vượt lên. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Tăng tốc độ để đua với xe tải, không cho phép họ vượt qua.[cite: 2]", "B. Đánh lái sang trái chiếm làn đường để xe tải không thể vượt.[cite: 2]", "C. Chủ động giảm tốc độ, giữ khoảng cách an toàn và quan sát kỹ tình hình.[cite: 2]", "D. Phanh gấp đột ngột để làm xe tải giật mình và không dám vượt nữa.[cite: 2]"], a: 2},
{q: "Câu 46: Xe phía sau liên tục nháy đèn và bật tín hiệu xin vượt tại đoạn đường đủ điều kiện an toàn và xe đó đã tiến rất sát đuôi xe bạn. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Tăng tốc độ để giữ khoảng cách, không cho xe sau vượt.[cite: 2]", "B. Hạ tốc độ, giữ khoảng cách an toàn phía trước và quan sát gương để nhường.[cite: 2]", "C. Bấm còi và nháy đèn hậu để phát tín hiệu từ chối cho vượt.[cite: 2]", "D. Đánh lái liên tục từ trái sang phải để chắn hướng vượt của xe sau.[cite: 2]"], a: 1},
{q: "Câu 47: Bạn nghe thấy tiếng còi hú ưu tiên dồn dập và quan sát thấy một chiếc xe cứu thương đang tiến đến rất gần từ phía sau. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Tăng tốc để dẫn đường cho xe cứu thương đi qua đám đông.[cite: 2]", "B. Giữ nguyên tốc độ và làn đường hiện tại để tránh gây lộn xộn.[cite: 2]", "C. Hạ tốc độ, bật tín hiệu cảnh báo và chủ động nhường đường theo đúng luật.[cite: 2]", "D. Phanh gấp để xe cứu thương có thể đi qua ngay.[cite: 2]"], a: 2},
{q: "Câu 48: Chiếc xe đi ngay phía trước đang bám sát vạch kẻ đường và bắt đầu có dấu hiệu lấn dần sang làn đường bạn đang di chuyển. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Tăng tốc để chiếm chỗ trống, không cho xe phía trước nhập làn thành công.[cite: 2]", "B. Chủ động giảm tốc độ và duy trì khoảng cách an toàn với xe đó.[cite: 2]", "C. Giữ tốc độ và bám thật sát xe phía trước để thu hẹp tối đa khoảng trống nhập làn.[cite: 2]", "D. Nhấn còi liên tục và giữ nguyên tốc độ để khẳng định quyền ưu tiên.[cite: 2]"], a: 1},
{q: "Câu 49: Một chiếc xe tải lớn đang di chuyển song song ở làn bên cạnh bắt đầu lấn sang một phần làn đường của bạn để tránh chướng ngại vật phía trước. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc để vượt qua xe tải thật nhanh trước khi bị ép làn.[cite: 2]", "B. Giảm tốc độ, giữ khoảng cách an toàn để tránh va chạm với thân xe tải.[cite: 2]", "C. Đi song song sát cạnh xe tải và bấm còi để yêu cầu họ về đúng làn.[cite: 2]", "D. Phanh gấp ngay khi thấy bánh xe tải bắt đầu đè lên vạch phân làn.[cite: 2]"], a: 1},
{q: "Câu 50: Một chiếc xe container ở làn bên cạnh đột ngột đánh lái chuyển hướng cắt ngang qua đầu xe bạn mà không hề có tín hiệu báo trước. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Đánh lái và tăng tốc để cố gắng lách qua trước khi xe container cắt đầu.[cite: 2]", "B. Lập tức giảm tốc độ, giữ khoảng cách an toàn để tránh va chạm trực diện.[cite: 2]", "C. Phanh gấp để tránh xa container vượt ẩu.[cite: 2]", "D. Giữ nguyên ga và không đạp phanh để buộc tài xế xe lớn phải nhường.[cite: 2]"], a: 1},
{q: "Câu 51: Trên đường hai chiều không có dải phân cách cứng, một chiếc xe tải đi đối diện bất ngờ lấn hẳn sang phần đường bạn đang di chuyển để vượt xe khác. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nháy đèn pha liên tục, tăng tốc để ép xe tải phải quay lại làn cũ.[cite: 2]", "B. Đánh lái sang làn ngược chiều của xe tải để né tránh va chạm.[cite: 2]", "C. Hạ tốc độ, giữ khoảng cách an toàn và đi sát về phía lề đường bên phải.[cite: 2]", "D. Phanh gấp và dừng xe ngày để chờ xe tải đi qua.[cite: 2]"], a: 2},
{q: "Câu 52: Đang di chuyển trên đường cao tốc, bạn bàng hoàng phát hiện xe phía trước bật đèn lùi và bắt đầu di chuyển ngược chiều về phía bạn. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Đánh lái và lách nhanh sang làn đường khác để vượt qua xe lùi.[cite: 2]", "B. Hạ tốc độ, giữ khoảng cách an toàn và chỉ dừng xe hoàn toàn khi thực sự cần.[cite: 2]", "C. Nhấn còi liên tục để cảnh báo các xe đang lùi dừng lại.[cite: 2]", "D. Dừng xe vào làn cao tốc để quan sát và gọi cứu hộ.[cite: 2]"], a: 1},
{q: "Câu 53: Tầm nhìn phía trước bị một chiếc xe tải lớn che khuất hoàn toàn, bất ngờ một chiếc xe máy đi ngược chiều xuất hiện ngay trước mặt bạn do lấn làn. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc để nhanh chóng lách qua người xe máy.[cite: 2]", "B. Giảm tốc độ, giữ khoảng cách an toàn và chú ý quan sát xung quanh.[cite: 2]", "C. Đánh lái gấp sang lề đường bên trái để tránh va chạm.[cite: 2]", "D. Bấm còi liên tục để xe máy phải dừng lại.[cite: 2]"], a: 1},
{q: "Câu 54: Tại đoạn đường có làn nhập, bạn thấy một chiếc xe tải từ đường nhánh đang bắt đầu tăng tốc để đi vào làn chính ngay phía trước đầu xe bạn. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga để vượt qua trước khi xe tải nhập vào làn chính.[cite: 2]", "B. Chủ động giảm tốc độ và duy trì khoảng cách an toàn cho xe tải nhập làn.[cite: 2]", "C. Bám sát đuôi xe phía trước để không cho xe tải có cơ hội nhập làn.[cite: 2]", "D. Phanh gấp để chờ xe tải đi qua.[cite: 2]"], a: 1},
{q: "Câu 55: Bạn phát hiện một vật cản nằm giữa làn đường và chiếc xe tải phía trước đang đánh lái gấp sang làn bạn để tránh. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Hạ tốc độ, giữ khoảng cách an toàn để nhường đường cho xe tải.[cite: 2]", "B. Đánh lái để cùng vượt vật cản đồng thời với xe tải.[cite: 2]", "C. Bám sát đuôi xe tải để tránh vật cản theo lộ trình của họ.[cite: 2]", "D. Phanh gấp, dừng ngay lập tức khi thấy xe tải bắt đầu đánh lái sang.[cite: 2]"], a: 0},
{q: "Câu 56: Xe con phía sau áp sát đuôi xe bạn và liên tục nháy đèn xi nhan trái để xin đường vượt lên trên đoạn đường cho phép. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Tăng tốc độ nhanh hơn và không cần phải nhường.[cite: 2]", "B. Giảm tốc độ nhẹ, giữ khoảng cách an toàn và quan sát gương để nhường đường.[cite: 2]", "C. Nháy đèn phanh liên tục để phát tín hiệu từ chối không cho vượt.[cite: 2]", "D. Đánh lái sang trái để xe con phía sau vượt.[cite: 2]"], a: 1},
{q: "Câu 57: Bạn đang di chuyển vào đoạn đường đang thi công có biển báo từ xa và bắt đầu thấy các rào chắn bằng tôn hoặc cọc tiêu phản quang. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc để nhanh chóng đi qua đoạn đường đầy bụi và vật cản.[cite: 2]", "B. Hạ tốc độ, giữ khoảng cách an toàn và tuân thủ đúng các biển hướng dẫn.[cite: 2]", "C. Đánh lái để lách qua các rào chắn với tốc độ nhanh để tiếp tục hành trình.[cite: 2]", "D. Phanh gấp giữa đường ngay khi thấy bóng dáng công nhân đang làm việc.[cite: 2]"], a: 1},
{q: "Câu 58: Tiếp tục hành trình qua khu vực công trường dài, chiếc xe phía trước đang di chuyển rất chậm do mặt đường bị thu hẹp đáng kể. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Kiên nhẫn giảm tốc độ và giữ khoảng cách an toàn tuyệt đối với xe đi trước.[cite: 2]", "B. Nhấn ga tăng tốc và tìm cách vượt xe phía trước ngay trong phạm vi công trường.[cite: 2]", "C. Bấm còi liên tục để thúc giục tài xế phía trước di chuyển nhanh hơn.[cite: 2]", "D. Bám sát đuôi xe trước, không để bất kỳ khoảng trống nào cho xe khác chen vào.[cite: 2]"], a: 0},
{q: "Câu 59: Một chiếc xe tải lớn di chuyển phía trước đang bắt đầu thực hiện thao tác bật xi nhan và lấn dần sang làn đường khác. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Tăng tốc để lách vào khoảng trống mà xe tải vừa để lại ở làn cũ.[cite: 2]", "B. Chủ động giảm tốc độ và duy trì khoảng cách an toàn với xe tải.[cite: 2]", "C. Giữ tốc độ và cố gắng chạy song song, không để xe tải chuyển làn.[cite: 2]", "D. Phanh gấp và tránh xa xe tải để tránh va chạm.[cite: 2]"], a: 1},
{q: "Câu 60: Một chiếc xe 16 chỗ từ đường nhánh phía bên phải đang từ từ tiến ra và bắt đầu nhập vào làn đường của bạn một cách quyết đoán. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc để xe 16 chỗ không thể nhập làn thành công.[cite: 2]", "B. Hạ tốc độ từ sớm, giữ khoảng cách an toàn để tạo điều kiện cho xe nhập làn.[cite: 2]", "C. Bám sát đuôi xe phía trước, không cho xe khách nhập làn.[cite: 2]", "D. Nhấn còi liên tục và giữ tốc độ, kiên quyết không nhường đường.[cite: 2]"], a: 1},
{q: "Câu 61: Tại vị trí đường nhập làn cao tốc, bạn thấy một chiếc xe con đang tăng tốc mạnh để nhập vào làn chính ngay sát phía trước đầu xe của bạn. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Tăng tốc để xe con phải lùi lại hoặc dừng lại ở làn nhập.[cite: 2]", "B. Rà nhẹ phanh để giảm tốc độ, tạo khoảng trống an toàn cho xe khác nhập làn.[cite: 2]", "C. Bấm còi liên tục để cảnh báo xe phía trước giữ vị trí.[cite: 2]", "D. Phanh gấp ngay tại điểm nhập làn để tránh va chạm.[cite: 2]"], a: 1},
{q: "Câu 62: Xe đi ngược chiều liên tục nháy đèn pha với cường độ mạnh vào thẳng mắt bạn khi đang di chuyển trên quốc lộ vào buổi tối. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Chủ động giảm tốc độ, giữ khoảng cách an toàn và tập trung quan sát lề đường phải.[cite: 2]", "B. Nháy đèn pha đáp trả và tăng tốc độ để nhanh chóng đi qua xe đó.[cite: 2]", "C. Đánh lái lấn sang làn đối diện để phản đối hành vi dùng đèn pha của họ.[cite: 2]", "D. Phanh gấp ngay giữa đường để dừng lại hỏi rõ nguyên nhân bị nháy đèn.[cite: 2]"], a: 0},
{q: "Câu 63: Bạn đang lái xe qua khu vực nông thôn vào giờ lùa gia súc, phát hiện một đàn bỏ đang thong thả đi ngang qua mặt đường nhựa. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Tăng tốc và bấm còi dồn dập để đàn bò hoảng sợ chạy nhanh hơn.[cite: 2]", "B. Giảm tốc độ sâu, giữ khoảng cách an toàn và chờ đợi đàn bò đi qua hết.[cite: 2]", "C. Đánh lái lách qua các khe hở giữa đàn bò để không bị chậm giờ.[cite: 2]", "D. Phanh gấp, xuống xe xua đuổi đàn bò ra khỏi quốc lộ để đi tiếp.[cite: 2]"], a: 1},
{q: "Câu 64: Khi đang di chuyển trên cung đường đèo núi quanh co với một bên là vực sâu, bất ngờ một chiếc xe tải đối diện xuất hiện ở khúc cua hẹp. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga để nhanh chóng thoát khỏi khúc cua nguy hiểm này.[cite: 2]", "B. Hạ tốc độ, giữ khoảng cách an toàn và đi sát về phía phần đường bên phải.[cite: 2]", "C. Đánh lái sát sang làn đường đối diện để mở rộng góc cua cho dễ quan sát.[cite: 2]", "D. Phanh gấp ngay khi thấy xe tải để tránh va chạm trực diện.[cite: 2]"], a: 1},
{q: "Câu 65: Bạn đang lái xe qua một đoạn đường cong dốc vào ban đêm, không có đèn đường và tầm nhìn bị hạn chế bởi bóng tối bao trùm phía trước. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Bật đèn pha để tăng tầm nhìn và tăng tốc tiếp tục hành trình.[cite: 2]", "B. Giảm tốc độ, giữ khoảng cách an toàn và bật tín hiệu cảnh báo nếu cần thiết.[cite: 2]", "C. Giữ nguyên tốc độ và bám sát theo vạch kẻ đường ở giữa dải phân cách.[cite: 2]", "D. Phanh gấp mỗi khi bạn cảm thấy có bóng đen xuất hiện phía trước.[cite: 2]"], a: 1},
{q: "Câu 66: Bạn đang đi sau một chiếc xe tải chở sắt thép cồng kềnh, bất ngờ một thanh sắt bị tuột dây chằng và rơi thẳng xuống mặt đường ngay trước xe bạn. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Bấm còi liên tục để cảnh báo cho xe tải.[cite: 2]", "B. Phanh gấp khi thấy thanh sắt rơi, tránh xa để tránh các vật rơi tiếp theo.[cite: 2]", "C. Đánh lái gấp sang làn bên trái ở tốc độ cao để né tránh thanh sắt vừa rơi.[cite: 2]", "D. Lập tức giảm tốc độ, giữ khoảng cách an toàn và quan sát để tránh vật cản.[cite: 2]"], a: 3},
{q: "Câu 67: Tại khu vực đồi núi, bạn phát hiện một đàn dê đang đứng gặm cỏ sát mép đường và có một vài con đang có ý định nhảy xổ ra lòng đường. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Hạ tốc độ từ xa, giữ khoảng cách an toàn và sẵn sàng xử lý nếu dê lao ra.[cite: 2]", "B. Tăng tốc để nhanh chóng đi qua khu vực đàn dê đang đứng.[cite: 2]", "C. Bấm còi dồn dập để đàn dê hoảng sợ mà chạy vào rừng.[cite: 2]", "D. Bám sát vào lề đường, không cho đàn dê có thể xổ ra đường.[cite: 2]"], a: 0},
{q: "Câu 68: Bạn lái xe đi vào một vùng có màn sương mù dày đặc, tầm nhìn giảm xuống dưới 20m, ánh đèn của xe phía trước chỉ còn là những đốm mờ nhạt. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc để mau chóng thoát khỏi vùng sương mù khó chịu này.[cite: 2]", "B. Giảm tốc độ sâu, giữ khoảng cách an toàn tối đa và bật đèn sương mù, đèn cảnh báo.[cite: 2]", "C. Tắt đèn xe để tránh hiện tượng phản xạ ánh sáng từ màn sương vào mắt.[cite: 2]", "D. Phanh gấp và dừng xe giữa đường để đợi đến khi sương mù tan hết.[cite: 2]"], a: 1},
{q: "Câu 69: Tại một khúc cua gấp trên đường đèo, bạn phát hiện một chiếc xe con đối diện đang mất lái và lao tới với tốc độ rất nhanh về phía xe bạn. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc để thoát khỏi điểm va chạm trong tích tắc.[cite: 2]", "B. Phanh gấp và đứng yên chờ đợi va chạm xảy ra.[cite: 2]", "C. Bấm còi và đánh lái sang làn đường đối diện để tránh xe kia.[cite: 2]", "D. Rà phanh giảm tốc độ tối đa, giữ khoảng cách an toàn và nép sát vào lề phải.[cite: 2]"], a: 3},
{q: "Câu 70: Bạn đang di chuyển trên đoạn đường cong vào ban ngày, mặc dù có biển báo nguy hiểm nhưng tầm nhìn phía trước vẫn bị che khuất hoàn toàn bởi vách núi. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Tăng tốc độ để thử cảm giác lái qua những khúc cua.[cite: 2]", "B. Nhấn còi liên tục nhưng vẫn giữ nguyên tốc độ cao để cảnh báo xe đối diện.[cite: 2]", "C. Đánh lái rộng sang làn đường ngược chiều để mở rộng tầm mắt nhìn xa hơn.[cite: 2]", "D. Hạ tốc độ, giữ khoảng cách an toàn và chú ý quan sát gương cầu lồi nếu có.[cite: 2]"], a: 3},
{q: "Câu 71: Bạn điều khiển xe qua cung đường có nhiều khúc cua chữ S liên tiếp, mặt đường hẹp và trơn trượt khiến việc quan sát xa cực kỳ khó khăn. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Tăng tốc để rút ngắn thời gian di chuyển qua đoạn đường này.[cite: 2]", "B. Phanh gấp tại mỗi đỉnh cua để đảm bảo xe không bị văng khỏi đường.[cite: 2]", "C. Luôn điều khiển xe chạy vào giữa mặt đường để dễ dàng đánh lái sang hai bên.[cite: 2]", "D. Giảm tốc độ phù hợp, giữ khoảng cách an toàn và đi đúng phần đường quy định.[cite: 2]"], a: 3},
{q: "Câu 72: Màn sương mù tiếp tục bao phủ dày đặc hơn, bạn hoàn toàn không nhìn rõ đèn hậu của xe đi trước cũng như vạch kẻ đường bên dưới. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Giữ tốc độ để bám sát theo bóng mờ của xe phía trước cho dễ đi.[cite: 2]", "B. Chủ động giảm tốc độ về mức cực thấp, giữ khoảng cách an toàn và quan sát kỹ.[cite: 2]", "C. Bật đèn pha và nhấn ga để di chuyển tiếp hành trình.[cite: 2]", "D. Phanh gấp liên tục để kiểm tra xem hệ thống phanh có bị ảnh hưởng bởi độ ẩm không.[cite: 2]"], a: 1},
{q: "Câu 73: Một đoạn đường cong bị một tảng đá lớn hoặc xe hỏng che khuất hoàn toàn tầm nhìn, khiến bạn không thể biết tình trạng giao thông phía sau. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Đánh lái gấp sang làn khác để nhanh chóng vượt qua vật cản che khuất tầm nhìn.[cite: 2]", "B. Giảm tốc độ, giữ khoảng cách an toàn và chuẩn bị sẵn sàng cho tình huống xấu.[cite: 2]", "C. Nhấn còi liên tục và giữ nguyên ga để duy trì đà leo dốc.[cite: 2]", "D. Nhập sang làn ngược chiều để dễ quan sát phía sau vật cản có xe nào không.[cite: 2]"], a: 1},
{q: "Câu 74: Bạn phát hiện một người đi xe đạp đang ở sát mép đường phía trước, bất ngờ người này loạng choạng và đi xuống lòng đường để chuẩn bị sang ngang. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc để đi qua trước khi người xe đạp chiếm phần đường của bạn.[cite: 2]", "B. Phanh gấp ngay sát người đi xe đạp và đợi các xe đi qua.[cite: 2]", "C. Bấm còi để người đi xe đạp giật mình mà quay lại sát lề.[cite: 2]", "D. Hạ tốc độ, giữ khoảng cách an toàn và chú ý quan sát kỹ hướng di chuyển.[cite: 2]"], a: 3},
{q: "Câu 75: Trong khu dân cư, bạn thấy một nhóm học sinh đang đứng trên vỉa hè và một đứa trẻ bắt đầu bước xuống lòng đường để chạy sang phía đối diện. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Tăng tốc độ để đứa trẻ phải dừng lại nhường đường cho xe ô tô của bạn.[cite: 2]", "B. Nhấn còi liên tục để cảnh báo và giữ nguyên tốc độ để duy trì lưu thông.[cite: 2]", "C. Giảm tốc độ, giữ khoảng cách an toàn và chủ động nhường đường cho người đi bộ.[cite: 2]", "D. Phanh gấp và đánh lái bám sát vào lề đường để tránh đứa trẻ.[cite: 2]"], a: 2},
{q: "Câu 76: Một đứa trẻ bất ngờ từ sau một chiếc xe tải đang đỗ chạy vụt ra lòng đường để nhặt bóng khi xe bạn chỉ còn cách vài mét. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc để lách nhanh qua trước mặt đứa trẻ.[cite: 2]", "B. Lập tức giảm tốc độ, giữ khoảng cách an toàn và sẵn sàng phanh dừng khẩn cấp.[cite: 2]", "C. Bấm còi thật mạnh để đứa trẻ biết và không di chuyển tiếp.[cite: 2]", "D. Đánh lái gấp sang làn đường ngược chiều mà không cần quan sát gương.[cite: 2]"], a: 1},
{q: "Câu 77: Tại một điểm giao cắt nhỏ, một chiếc xe con bất ngờ phóng từ đường nhánh ra và băng ngang qua đường chính ngay trước tầm mắt bạn. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc để xe con phải dừng lại nhường đường.[cite: 2]", "B. Hạ tốc độ, giữ khoảng cách an toàn và sẵn sàng xử lý va chạm.[cite: 2]", "C. Bám sát vào sau xe con và nhấn còi để thể hiện sự bực bội.[cite: 2]", "D. Phanh gấp hết sức để dừng xe lại và hi vọng không có va chạm.[cite: 2]"], a: 1},
{q: "Câu 78: Tại giao lộ, mặc dù hướng của bạn đang xanh nhưng một chiếc xe máy bất ngờ tăng tốc vượt đèn đỏ và cắt ngang hướng di chuyển của bạn. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc để cảnh cáo hành vi vi phạm của người đi xe máy.[cite: 2]", "B. Giảm tốc độ, giữ khoảng cách an toàn và nhường đường để đảm bảo an toàn.[cite: 2]", "C. Nhấn còi liên tục và không thay đổi tốc độ vì mình đi đúng luật.[cite: 2]", "D. Phanh gấp ngay giữa giao lộ và chờ xe máy đi qua.[cite: 2]"], a: 1},
{q: "Câu 79: Bạn đang di chuyển qua đoạn đường có nhiều ngõ, một chiếc xe máy từ ngõ bất ngờ nhập vào làn đường chính ngay trước mặt bạn với tốc độ chậm. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Tăng tốc không cho xe máy có cơ hội nhập vào làn của bạn.[cite: 2]", "B. Chủ động giảm tốc độ, giữ khoảng cách an toàn để xe máy nhập làn an toàn.[cite: 2]", "C. Bám sát xe máy và nhấn còi liên tục để hối thúc họ tăng tốc theo bạn.[cite: 2]", "D. Đánh lái gấp sang làn ngược chiều để tránh phải giảm tốc độ.[cite: 2]"], a: 1},
{q: "Câu 80: Bạn đang lái xe trên đoạn đường có mặt đường rất xấu, chiếc xe tải phía trước liên tục đánh lái qua hai bên để né các hố sâu và đá hộc. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Kiên nhẫn giảm tốc độ, giữ khoảng cách an toàn tối đa với xe phía trước.[cite: 2]", "B. Bám sát và sẵn sàng tăng tốc để tìm cơ hội vượt qua chiếc xe tải đi chậm đó.[cite: 2]", "C. Đánh lái liên tục cùng với xe tải phía trước để né ô gà.[cite: 2]", "D. Giữ tốc độ và phanh gấp mỗi khi bạn thấy xe tải phía trước đỏ đèn phanh.[cite: 2]"], a: 0},
{q: "Câu 81: Chiếc xe đi ngay phía trước chạy rất không ổn định, lúc nhanh lúc chậm và đèn phanh liên tục bật sáng dù đường đang thoáng. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc để vượt qua xe này càng sớm càng tốt cho an toàn.[cite: 2]", "B. Bám thật sát đuôi xe phía trước và bấm còi liên tục để tài xế tập trung lái.[cite: 2]", "C. Hạ tốc độ, duy trì khoảng cách an toàn và quan sát kỹ mọi diễn biến phía trước.[cite: 2]", "D. Phanh gấp giữa đường để tạo một khoảng cách cực xa với chiếc xe bất thường đó.[cite: 2]"], a: 2},
{q: "Câu 82: Khoảng cách giữa xe bạn và xe tải phía trước đang bị thu hẹp rất nhanh do xe tải bất ngờ phanh đứng lại để tránh vật cản. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Đánh lái sang làn khác và tăng tốc để vượt lên nhanh chóng.[cite: 2]", "B. Giữ nguyên tốc độ và bấm còi báo động liên tục để xe tải phía trước biết.[cite: 2]", "C. Kịp thời giảm tốc độ, giữ khoảng cách an toàn để ngăn chặn va chạm đuôi xe.[cite: 2]", "D. Phanh gấp đến khi dừng hẳn xe và hi vọng không có va chạm xảy ra.[cite: 2]"], a: 2},
{q: "Câu 83: Xe phía trước đang di chuyển sát lề đường bên phải, tài xế bất ngờ bật xi nhan phải và rà phanh sâu để chuẩn bị rẽ vào bãi đỗ. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Đánh lái và tăng tốc để vượt xe đó từ phía bên phải trước khi họ rẽ.[cite: 2]", "B. Giảm tốc độ, giữ khoảng cách an toàn và chú ý quan sát hướng xe rẽ.[cite: 2]", "C. Bám sát vào đuôi xe phía trước và bấm còi liên tục để hối thúc họ nhanh lên.[cite: 2]", "D. Phanh gấp ngay khi thấy đèn xi nhan xe trước vừa chớp sáng.[cite: 2]"], a: 1},
{q: "Câu 84: Xe phía trước có dấu hiệu dạt dần sang trái, đồng thời tài xế bật tín hiệu xi nhan trái để chuẩn bị thực hiện thao tác chuyển hướng. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga để vượt qua phía bên trái của chiếc xe đang rẽ đó.[cite: 2]", "B. Chủ động giảm tốc độ và duy trì khoảng cách an toàn với xe phía trước.[cite: 2]", "C. Bấm còi liên tục để yêu cầu xe đó phải dừng lại nhường đường cho bạn đi thẳng.[cite: 2]", "D. Phanh gấp để xe phía trước thực hiện thao tác rẽ xong mới di chuyển.[cite: 2]"], a: 1},
{q: "Câu 85: Chiếc xe con phía trước giảm tốc độ rõ rệt khi gần đến điểm mở dải phân cách và bắt đầu đánh hết lái để thực hiện việc quay đầu. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Đánh lái và nhấn ga tăng tốc để lách qua làn khác để vượt qua.[cite: 2]", "B. Nhấn còi thật mạnh và dài để xe đó cho xe mình quay đầu trước.[cite: 2]", "C. Bám sát vào xe phía trước để thực hiện quay đầu cùng nhau.[cite: 2]", "D. Hạ tốc độ, giữ khoảng cách an toàn và kiên nhẫn quan sát quá trình quay đầu.[cite: 2]"], a: 3},
{q: "Câu 86: Một chiếc xe taxi đang chạy lừ đừ sát lề đường bên phải, bất ngờ tài xế phanh gấp đột ngột để kịp đón một vị khách đang vẫy xe trên vỉa hè. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc và đánh lái qua làn khác để vượt qua taxi ngay khi đèn phanh sáng.[cite: 2]", "B. Bám sát xe taxi và nhấn còi liên tục để phản đối hành vi dừng xe.[cite: 2]", "C. Giảm tốc độ, giữ khoảng cách an toàn và chú ý quan sát hành khách lên xe.[cite: 2]", "D. Phanh gấp ngay phía sau đuôi taxi và dừng lại đó chờ đợi.[cite: 2]"], a: 2},
{q: "Câu 87: Một chiếc xe công nghệ đang di chuyển lúng túng do tài xế nhìn bản đồ, rồi bất ngờ dừng lại giữa đường để trả khách mà không vào sát lề. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc và đánh lái sang làn bên trái để vượt qua.[cite: 2]", "B. Phanh gấp dừng lại nhường đường cho xe công nghệ đi xa hẳn.[cite: 2]", "C. Bấm còi dồn dập nhắc nhở tài xế tập trung di chuyển.[cite: 2]", "D. Chủ động giảm tốc độ, giữ khoảng cách an toàn và quan sát xung quanh.[cite: 2]"], a: 3},
{q: "Câu 88: Xe đi phía trước không giữ được làn đường ổn định, liên tục đánh lái sang trái rồi lại sang phải một cách vô thức. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Hạ tốc độ, duy trì khoảng cách an toàn lớn và chú ý quan sát kỹ.[cite: 2]", "B. Nhấn ga tăng tốc để vượt qua chiếc xe này thật nhanh để va chạm.[cite: 2]", "C. Chạy song song sát cạnh để chiếc xe đó đánh lái sang được.[cite: 2]", "D. Bám sát đuôi xe và bấm còi liên tục để nhắc nhở tài xế phía trước.[cite: 2]"], a: 0},
{q: "Câu 89: Một chiếc xe con phía trước chạy rất chậm và bất ngờ bật đèn cảnh báo nguy hiểm (hazard), báo hiệu xe đang gặp sự cố kỹ thuật. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Đánh lái sáng làn khác và nhấn ga tăng tốc để vượt qua chiếc xe hỏng đó.[cite: 2]", "B. Bám sát vào đuôi xe và bấm còi mạnh để yêu cầu họ phải dạt vào lề đường.[cite: 2]", "C. Giảm tốc độ, giữ khoảng cách an toàn và quan sát để vượt qua khi đủ điều kiện.[cite: 2]", "D. Phanh gấp ngay phía sau xe hỏng và bật đèn cảnh báo để dừng lại cùng họ.[cite: 2]"], a: 2},
{q: "Câu 90: Bạn đang đi sau một chiếc xe chở đồ nội thất cồng kềnh, hàng hóa vượt quá kích thước thùng xe và đang rung lắc dữ dội theo mỗi nhịp xe chạy. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc để vượt qua thật nhanh trước khi hàng hóa rơi xuống đầu xe bạn.[cite: 2]", "B. Chủ động giảm tốc độ và duy trì khoảng cách an toàn cực lớn với xe tải.[cite: 2]", "C. Chạy song song xe tải và ra hiệu cho tài xế biết hàng hóa đang bị lỏng lẻo.[cite: 2]", "D. Bấm còi hối thúc xe tải chạy nhanh hơn để mau chóng kết thúc đoạn đường này.[cite: 2]"], a: 1},
{q: "Câu 91: Tại một đoạn đường dốc dài và cao, một chiếc xe tải phía trước đang đổ dốc và có dấu hiệu mất kiểm soát tốc độ, lao đi rất nhanh. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Tăng tốc để cố gắng bám theo và gọi cho cứu hộ khi xe tải gặp nguy hiểm.[cite: 2]", "B. Hạ tốc độ, giữ khoảng cách an toàn tối đa để tránh các tình huống xấu nhất.[cite: 2]", "C. Phanh gấp liên tục để giữ khoảng cách xe mình luôn cố định với xe tải.[cite: 2]", "D. Nhấn còi dồn dập với hy vọng tài xế xe tải sẽ hãm phanh lại.[cite: 2]"], a: 1},
{q: "Câu 92: Tại khu vực giao lộ cho phép quay đầu, một chiếc xe container dài đang bắt đầu thực hiện cú xoay đầu, chiếm gần như toàn bộ mặt đường. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc để cố gắng luồn qua trước khi xe container chắn ngang.[cite: 2]", "B. Giảm tốc độ từ xa, giữ khoảng cách an toàn và chờ xe container hoàn thành thao tác.[cite: 2]", "C. Bám sát vào phần đầu xe container để ép tài xế phải dừng lại cho bạn qua trước.[cite: 2]", "D. Phanh gấp giữa đường và bấm còi liên tục để thể hiện sự không hài lòng.[cite: 2]"], a: 1},
{q: "Câu 93: Chiếc xe đi trước di chuyển với tốc độ không đều, tài xế thường xuyên rà phanh không lý do làm đèn phanh đỏ rực liên tục. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Đánh lái sang làn bên cạnh và tăng tốc để vượt qua xe này.[cite: 2]", "B. Chủ động giảm tốc độ, giữ khoảng cách an toàn và tập trung quan sát.[cite: 2]", "C. Bám sát đuôi xe và bấm còi mỗi khi thấy họ đỏ đèn phanh để nhắc nhở.[cite: 2]", "D. Phanh gấp theo xe phía trước ở mọi thời điểm để giữ khoảng cách.[cite: 2]"], a: 1},
{q: "Câu 94: Đang đi trên đoạn đường nhiều ổ gà lớn, chiếc xe con phía trước bất ngờ đánh lái sang làn của bạn để tránh một hố sâu nguy hiểm. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc và đánh lái theo xe phía trước.[cite: 2]", "B. Hạ tốc độ, giữ khoảng cách an toàn để tránh va chạm với hông xe trước.[cite: 2]", "C. Bám thật sát xe phía trước để không phải nhìn thấy những ổ gà dưới đất.[cite: 2]", "D. Phanh gấp khi thấy ổ gà, rồi từ từ di chuyển qua.[cite: 2]"], a: 1},
{q: "Câu 95: Tầm nhìn phía trước của bạn bị một chiếc xe khách lớn chắn hoàn toàn, bạn không thể nhìn thấy đèn tín hiệu hay tình hình giao thông phía trước xe đó. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc để vượt qua xe khách nhằm lấy lại tầm nhìn bao quát.[cite: 2]", "B. Giảm tốc độ, tăng khoảng cách an toàn và chú ý quan sát hai bên xe khách.[cite: 2]", "C. Bám thật sát vào đuôi xe khách để tận dụng lực hút gió giúp xe chạy nhẹ hơn.[cite: 2]", "D. Phanh gấp dừng lại một khoảng cách đủ xa để tránh va chạm[cite: 2]"], a: 1},
{q: "Câu 96: Chiếc xe đi trước đang duy trì một tốc độ cực thấp, chậm hơn rất nhiều so với quy định và các phương tiện xung quanh. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc và đánh lái sang làn khác để vượt qua ngay xe đó.[cite: 2]", "B. Bám sát đuôi xe và bấm còi liên tục để tạo áp lực tâm lý cho xe phía trước.[cite: 2]", "C. Hạ tốc độ phù hợp với tình hình giao thông, giữ khoảng cách an toàn.[cite: 2]", "D. Vượt lên và phanh gấp đột ngột rồi lại nhấn ga mạnh để dọa tài xế phía trước.[cite: 2]"], a: 2},
{q: "Câu 97: Tại giao lộ có đèn tín hiệu, khi đèn bắt đầu chuyển sang màu đỏ, chiếc xe phía trước đang giảm tốc độ và dừng lại đúng vạch dừng quy định. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc để lách qua xe đó và cố gắng vượt đèn đỏ.[cite: 2]", "B. Bấm còi hối thúc tài xế phía trước vượt đèn đỏ để mình không bị trễ hành trình.[cite: 2]", "C. Giảm tốc độ từ sớm và dừng xe đúng quy định phía sau xe trước.[cite: 2]", "D. Phanh gấp ngay sát đuôi xe phía trước và đợi đèn xanh mới đi tiếp.[cite: 2]"], a: 2},
{q: "Câu 98: Khi xe vừa tiến đến gần vạch dừng mà đèn tín hiệu chuyển sang màu vàng, chiếc xe phía trước bất ngờ nhấn ga tăng tốc để cố vượt qua giao lộ. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc bám theo xe phía trước để cùng vượt đèn vàng.[cite: 2]", "B. Chủ động giảm tốc độ, giữ khoảng cách an toàn và dừng lại trước vạch.[cite: 2]", "C. Bấm còi liên tục và bám sát đuôi xe đó để không bị xe khác chen vào.[cite: 2]", "D. Phanh gấp ngay giữa vạch dừng và chờ đèn xanh mới đi tiếp.[cite: 2]"], a: 1},
{q: "Câu 99: Xe đi trước đang bám sát vạch kẻ đường, tài xế bất ngờ thực hiện củ chuyển làn đột ngột cắt ngang đầu xe bạn mà không hề bật xi nhan. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc không cho xe đó thực hiện việc chuyên làn.[cite: 2]", "B. Lập tức giảm tốc độ và duy trì khoảng cách an toàn với xe phía trước.[cite: 2]", "C. Bấm còi và nháy đèn pha liên tục để phản đối hành vi lái xe thiếu văn hóa.[cite: 2]", "D. Đánh lái gấp sang hướng ngược lại để tránh và vượt lên.[cite: 2]"], a: 1},
{q: "Câu 100: Chiếc xe đi phía trước không giữ đúng phần đường của mình, bánh xe bắt đầu đè vạch và lấn dần sang làn đường của bạn. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc để vượt qua xe này không để họ đang lấn làn.[cite: 2]", "B. Hạ tốc độ, giữ khoảng cách an toàn và quan sát kỹ diễn biến.[cite: 2]", "C. Bấm còi và nháy đèn pha liên tục để buộc họ trở lại làn cũ.[cite: 2]", "D. Phanh gấp ngay lập tức để tránh xa chiếc xe đang đi sai làn.[cite: 2]"], a: 1},
{q: "Câu 101: Một chiếc xe ben chở đầy cát sỏi phía trước không được che chắn kỹ, khiến đất đá rơi vãi xuống mặt đường ngay trước hướng di chuyển của xe bạn. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc thật nhanh để vượt qua xe tải nhằm tránh bụi và đá văng.[cite: 2]", "B. Giảm tốc độ, giữ khoảng cách an toàn thật lớn để tránh đá bắn vào kính xe.[cite: 2]", "C. Đánh lái liên tục sang trái rồi sang phải để né tránh các viên đá đang rơi.[cite: 2]", "D. Phanh gấp ngay giữa đường để chờ đến khi xe ben đi xa.[cite: 2]"], a: 1},
{q: "Câu 102: Một chiếc xe con phía trước bất ngờ thực hiện thao tác quay đầu tại nơi có biển cấm quay đầu, tài xế xoay ngang xe đột ngột giữa làn đường. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc để lách qua trước khi xe con quay đầu chiếm hết đường.[cite: 2]", "B. Hạ tốc độ, duy trì khoảng cách an toàn và sẵn sàng dừng lại chờ đợi.[cite: 2]", "C. Bấm còi liên tục và bám sát vào hông xe đó để phản đối hành vi vi phạm.[cite: 2]", "D. Phanh gấp và đánh lái bám sát vào dải phân cách giữa đường.[cite: 2]"], a: 1},
{q: "Câu 103: Xe phía trước đang di chuyển bình thường bỗng nhiên phanh đứng lại ngay giữa đường mà không hề tấp vào lề đường để đỗ. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Đánh lái gấp và thực hiện pha vượt ngay lập tức mà không cần quan sát.[cite: 2]", "B. Giảm tốc độ, giữ khoảng cách an toàn và quan sát kỹ tình hình xung quanh.[cite: 2]", "C. Bám sát đuôi xe phía trước và nhấn còi dồn dập hối thúc họ di chuyển tiếp.[cite: 2]", "D. Phanh gấp ngay sát đuôi xe trước và hi vọng không có va chạm.[cite: 2]"], a: 1},
{q: "Câu 104: Xe phía trước vừa dừng lại, cánh cửa xe bất ngờ mở toang và có người đang loay hoay chuẩn bị bước xuống lòng đường ngay trước mũi xe bạn. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Đánh lái và tăng tốc để lách qua trước khi người đó kịp bước xuống hẳn.[cite: 2]", "B. Hạ tốc độ, duy trì khoảng cách an toàn và sẵn sàng dừng xe nhường đường.[cite: 2]", "C. Bấm còi thật mạnh để người trong xe biết mà đóng cửa lại ngay lập tức.[cite: 2]", "D. Phanh gấp ngay sát cạnh cánh cửa đang mở để cảnh cáo tài xế.[cite: 2]"], a: 1},
{q: "Câu 105: Bạn quan sát thấy xe phía trước có dán phù hiệu xe chở trẻ em và có người đang loay hoay phía sau, tiềm ẩn nguy cơ trẻ nhỏ bất ngờ mở cửa xuống xe. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc để nhanh chóng vượt qua chiếc xe đó.[cite: 2]", "B. Chủ động giảm tốc độ, giữ khoảng cách an toàn và chú ý quan sát các cánh cửa xe.[cite: 2]", "C. Bấm còi liên tục khi đi ngang qua để cảnh báo những người ngồi trong xe.[cite: 2]", "D. Bám sát đuôi xe đó để nhìn xem bên trong xe có trẻ nhỏ không để đi tiếp.[cite: 2]"], a: 1},
{q: "Câu 106: Tại đoạn đường đô thị có nhiều ngõ nhỏ, chiếc xe phía trước giảm tốc độ sâu và bắt đầu bật xi nhan để chuẩn bị rẽ vào một con ngõ hẹp. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc để ép xe đó và vượt qua trước khi họ kịp đánh lái rẽ vào ngõ.[cite: 2]", "B. Giảm tốc độ, giữ khoảng cách an toàn và kiên nhẫn chờ xe trước rẽ xong.[cite: 2]", "C. Bấm còi liên tục hối thúc tài xế thực hiện rẽ nhanh hơn.[cite: 2]", "D. Phanh gấp đột ngột khi xe trước bật xi nhan và chờ đợi họ rẽ.[cite: 2]"], a: 1},
{q: "Câu 107: Xe phía trước phát hiện có người già đang chuẩn bị băng qua đường và tài xế bắt đầu rà phanh để thực hiện việc nhường đường. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc để vượt qua cả xe phía trước lẫn người đi bộ đang sang đường.[cite: 2]", "B. Bấm còi thật to để người đi bộ phải lùi lại nhường cho xe của bạn đi trước.[cite: 2]", "C. Hạ tốc độ, duy trì khoảng cách an toàn và cùng nhường đường cho người đi bộ.[cite: 2]", "D. Phanh gấp ngay sát đuôi xe phía trước để thể hiện sự đồng tình nhường đường[cite: 2]"], a: 2},
{q: "Câu 108: Trong điều kiện giao thông giờ cao điểm đông đúc, chiếc xe phía trước phải đánh lái gấp sang làn bạn để tránh một xe máy đang di chuyển ngược chiều. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Đánh lái và tăng tốc để chen vào khoảng trống trước khi xe đó kịp sang làn.[cite: 2]", "B. Chủ động giảm tốc độ, giữ khoảng cách an toàn để xe phía trước né tránh.[cite: 2]", "C. Bám sát đuôi xe phía trước, không để bất kỳ xe nào chen vào.[cite: 2]", "D. Bấm còi liên tục và kiên quyết giữ vững chân ga không đạp phanh.[cite: 2]"], a: 1},
{q: "Câu 109: Tình hình giao thông bắt đầu trở nên căng thẳng, các phương tiện phía trước đang dừng nối đuôi nhau hàng loạt do có ùn tắc tại giao lộ phía trên. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Tìm kẽ hở nhỏ nhất giữa các xe để tìm cách lách vào.[cite: 2]", "B. Giảm tốc độ, duy trì khoảng cách an toàn và kiên nhẫn di chuyển theo dòng xe.[cite: 2]", "C. Bám thật sát đuôi xe phía trước để không bị các xe khác chen ngang vào đầu xe.[cite: 2]", "D. Bấm còi liên tục và dài để yêu cầu các phương tiện phía trước phải di chuyển.[cite: 2]"], a: 1},
{q: "Câu 110: Con đường bạn đang đi bắt đầu thu hẹp lại do có biển báo đường hẹp, chiếc xe đi trước đang thực hiện việc giảm tốc độ để tiến vào đoạn đường này. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc để vượt lên chiếm vị trí trước xe phía trước tại đoạn đường hẹp.[cite: 2]", "B. Hạ tốc độ, giữ khoảng cách an toàn và lần lượt di chuyển vào đoạn đường hẹp.[cite: 2]", "C. Chạy song song với xe trước để cùng nhau đi vào đoạn đường bị thu hẹp.[cite: 2]", "D. Phanh gấp ngay tại điểm bắt đầu đoạn đường hẹp khiến giao thông bị tắc nghẽn.[cite: 2]"], a: 1},
{q: "Câu 111: Phía trước là một cây cầu hẹp chỉ đủ một làn xe, chiếc xe khách phía trước đang đi chậm lại để quan sát và chuẩn bị đi qua cầu. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc để vượt xe khách ngay khi xe đó bắt đầu lên cầu hẹp.[cite: 2]", "B. Giảm tốc độ, giữ khoảng cách an toàn và chờ xe phía trước qua cầu xong.[cite: 2]", "C. Bấm còi liên tục để tài xế xe khách phải đi nhanh hơn trên cầu.[cite: 2]", "D. Bám sát đuôi xe khách để ngăn cản không cho xe đối diện có cơ hội lên cầu.[cite: 2]"], a: 1},
{q: "Câu 112: Mặt đường phía trước vừa có trận mưa rào nên rất trơn trượt, xe đi trước đang thực hiện việc giảm tốc độ để đảm bảo an toàn khi vào cua. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc để đi qua đoạn đường ướt thật nhanh.[cite: 2]", "B. Chủ động hạ tốc độ, duy trì khoảng cách an toàn tối đa với phương tiện đi trước.[cite: 2]", "C. Phanh liên tục để tự kiểm tra độ bám đường của lốp xe mình.[cite: 2]", "D. Bám thật sát vào đuôi xe phía trước để tận dụng vệt nước đã bị xe trước gạt đi.[cite: 2]"], a: 1},
{q: "Câu 113: Chiếc xe con phía trước bắt đầu đánh lái để đi vào một khúc cua gắt trên đường đèo núi với tầm nhìn bị khuất hoàn toàn. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc để vượt xe đó ngay trong phạm vi khúc cua nguy hiểm.[cite: 2]", "B. Hạ tốc độ, giữ khoảng cách an toàn và chú ý quan sát kỹ các xe đối diện.[cite: 2]", "C. Đánh lái cùng lúc và bám sát vào hông xe phía trước khi đang ôm cua.[cite: 2]", "D. Bấm còi liên tục trong suốt quá trình xe đang thực hiện cú cua.[cite: 2]"], a: 1},
{q: "Câu 114: Bạn đang lái xe trong màn đêm sương mù dày đặc, ánh đèn hậu của chiếc xe phía trước mờ ảo đến mức bạn không thể nhận biết khoảng cách chính xác. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc để tiến thật sát vào xe trước cho dễ quan sát bóng xe.[cite: 2]", "B. Giảm tốc độ, giữ khoảng cách an toàn lớn và bật đèn cảnh báo nguy hiểm.[cite: 2]", "C. Tắt toàn bộ hệ thống chiếu sáng để mắt không bị lóa bởi màn sương mù.[cite: 2]", "D. Phanh gấp giữa đường để đảm bảo mình không đâm vào xe phía trước.[cite: 2]"], a: 1},
{q: "Câu 115: Khi di chuyển vào ban đêm trên cung đường không có đèn cao áp, tầm nhìn của bạn đối với chiếc xe tải chở hàng phía trước bị suy giảm nghiêm trọng. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc để vượt qua xe tải phía trước.[cite: 2]", "B. Chủ động giảm tốc độ, duy trì khoảng cách an toàn và sử dụng đèn hợp lý.[cite: 2]", "C. Nháy đèn pha liên tục để chiếu thẳng vào gương chiếu hậu xe trước.[cite: 2]", "D. Bám thật sát vào xe trước để đi theo ánh đèn hậu của họ cho dễ quan sát đường.[cite: 2]"], a: 1},
{q: "Câu 116: Xe đi đối diện bất ngờ bật đèn pha cường độ cao hướng thẳng vào kính lái, khiến bạn bị chói mắt hoàn toàn và không nhìn thấy phần đường phía trước. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc để mau chóng vượt qua chiếc xe gây chói mắt đó.[cite: 2]", "B. Giảm tốc độ, giữ khoảng cách an toàn và tập trung nhìn về phía lề đường bên phải.[cite: 2]", "C. Bật đèn pha của xe mình để chiếu lại tài xế đối diện.[cite: 2]", "D. Phanh gấp ngay tại vị trí đang đứng vì hoàn toàn không nhìn thấy gì.[cite: 2]"], a: 1},
{q: "Câu 117: Không rõ lý do gì nhưng chiếc xe con đang di chuyển bình thường phía trước đột ngột giảm tốc độ xuống mức cực thấp, gần như dừng lại. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Đánh lái và nhấn ga tăng tốc để thực hiện pha vượt xe con ngay lập tức.[cite: 2]", "B. Hạ tốc độ, duy trì khoảng cách an toàn và chú ý quan sát diễn biến phía trước.[cite: 2]", "C. Bám sát đuôi xe phía trước và nhấn còi dồn dập để phản đối.[cite: 2]", "D. Phanh gấp ngay để dừng lại và hi vọng không va chạm.[cite: 2]"], a: 1},
{q: "Câu 118: Có một vật cản lớn bất ngờ xuất hiện trên quốc lộ và chiếc xe tải phía trước đang phải thực hiện thao tác đánh lái gấp để né tránh. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc để cố vượt qua vật cản cùng một lúc với xe tải đi trước.[cite: 2]", "B. Giảm tốc độ, giữ khoảng cách an toàn và chuẩn bị sẵn sàng để tránh vật cản.[cite: 2]", "C. Đánh lái gấp sang hướng ngược lại với hướng xe trước để không bị chắn tầm nhìn.[cite: 2]", "D. Phanh gấp ngay lập tức khi thấy bóng dáng vật cản từ xa.[cite: 2]"], a: 1},
{q: "Câu 119: Bạn nhìn thấy biển báo bắt đầu vào khu đông dân cư và chiếc xe tải phía trước đang từ từ giảm tốc độ để tuân thủ đúng giới hạn tốc độ quy định. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Đánh lái gấp để vượt qua xe tải trước khi vào sâu hơn trong khu dân cư.[cite: 2]", "B. Chủ động hạ tốc độ, duy trì khoảng cách an toàn theo đúng luật giao thông.[cite: 2]", "C. Bấm còi hối thúc tài xế xe tải phải đi nhanh lên.[cite: 2]", "D. Bám thật sát đuôi xe tải, phanh gấp mỗi khi xe tải giảm tốc độ.[cite: 2]"], a: 1},
{q: "Câu 120: Tại khu vực có trường học với biển cảnh báo và rất nhiều học sinh đang tan trường đi lại đông đúc, xe phía trước đang giảm tốc độ sâu để nhường đường. Phương án xử lý của bạn là:[cite: 2]", o: ["A. Nhấn ga tăng tốc để nhanh chóng thoát khỏi khu vực đông đúc học sinh này.[cite: 2]", "B. Bấm còi liên tục và dồn dập để yêu cầu học sinh phải tránh đường cho xe đi.[cite: 2]", "C. Giảm tốc độ, giữ khoảng cách an toàn và sẵn sàng nhường đường cho học sinh.[cite: 2]", "D. Phanh gấp và dừng xe ngay giữa công trường để chờ học sinh đi hết mới đi tiếp.[cite: 2]"], a: 2}
];
    let timerInterval;
    let timeLeft = 20 * 60; // 20 phút chuẩn thi thật
    let currentExam = [];
    let isSubmitted = false;

    window.onload = function() {
        renderHistory();
    };

    // Hàm xáo trộn mảng (đảo vị trí câu hỏi)
    function shuffleArray(array) {
        let shuffled = [...array];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    }

    function startExam() {
        const examType = document.getElementById("examSelect").value;
        let pool = [];

        // Kiểm tra data có đủ chưa (phòng hờ m chưa dán đủ 120 câu)
        if (mockData120.length < 120) {
            alert("Lỗi: Dữ liệu chưa đủ 120 câu! M nhớ dán đủ cục 120 câu vào code nhé.");
            return;
        }

        // Lọc 30 câu theo đề
        if  (examType === "random") {
            // Đề ngẫu nhiên: Xáo toàn bộ 120 câu rồi bốc 30 câu đầu tiên
            pool = shuffleArray(mockData120).slice(0, 30);
        }

        // Đảo luôn vị trí 30 câu vừa bốc được để mỗi lần thi là một thứ tự khác nhau
        currentExam = shuffleArray(pool);
        isSubmitted = false;

        document.getElementById("startBtn").style.display = "none";
        document.getElementById("submitBtn").style.display = "block";
        document.getElementById("resultArea").style.display = "none";
        
        renderQuestions();
        
        clearInterval(timerInterval);
        timeLeft = 20 * 60;
        document.getElementById("timer").innerText = "Thời gian: 20:00";
        document.getElementById("timer").style.color = "#c0392b";
        timerInterval = setInterval(updateTimer, 1000);
    }

function renderQuestions() {
        const examArea = document.getElementById("examArea");
        examArea.innerHTML = "";
        
        currentExam.forEach((item, index) => {
            const div = document.createElement("div");
            div.className = "question-card";
            
            let optionsHtml = "";
            item.o.forEach((opt, i) => {
                // Đã đổi sang lệnh split để cắt đuôi rác an toàn 100%
                let cleanOpt = opt.split("[cite")[0].trim();
                optionsHtml += `<label id="label-q${index}-o${i}"><input type="radio" name="q${index}" value="${i}"> ${cleanOpt}</label>`;
            });

            // Gọt sạch rác ở câu hỏi và đánh số thứ tự mới
            let cleanQ = item.q.split("[cite")[0].trim();
            cleanQ = cleanQ.replace(/^Câu \d+:/, `Câu ${index + 1}:`);

            div.innerHTML = `<h3>${cleanQ}</h3><div class="options">${optionsHtml}</div>`;
            examArea.appendChild(div);
        });
    }
    function updateTimer() {
        if (isSubmitted) return;
        const m = Math.floor(timeLeft / 60);
        const s = timeLeft % 60;
        document.getElementById("timer").innerText = `Thời gian: ${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
        
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            document.getElementById("timer").innerText = "HẾT GIỜ!";
            alert("Hết tg mần làm bài r ! Đợi tí");
            submitExam();
        }
        timeLeft--;
    }

    function submitExam() {
        if (isSubmitted) return;
        isSubmitted = true;
        clearInterval(timerInterval);
        
        let score = 0;
        
        currentExam.forEach((item, index) => {
            const options = document.getElementsByName(`q${index}`);
            let selectedValue = -1;

            options.forEach(opt => {
                opt.disabled = true;
                opt.parentElement.style.cursor = "not-allowed";
                if (opt.checked) {
                    selectedValue = parseInt(opt.value);
                }
            });

            options.forEach((opt, i) => {
                const label = document.getElementById(`label-q${index}-o${i}`);
                if (i === item.a) label.classList.add("correct-ans");
                if (opt.checked && selectedValue !== item.a) label.classList.add("wrong-ans");
            });

            if (selectedValue === item.a) score++;
        });

        const resultArea = document.getElementById("resultArea");
        resultArea.style.display = "block";
        
        const total = currentExam.length; // 30 câu
        const passScore = 27; // Luật thi B1: Đúng từ 27/30 trở lên
        
        if (score >= passScore) {
            resultArea.className = "result pass";
            resultArea.innerHTML = `Tạm ok, đạt ${score}/${total} câu.`;
        } else {
            resultArea.className = "result fail";
            resultArea.innerHTML = `Tạch. Đúng được có ${score}/${total} câu. (Cần đúng ít nhất ${passScore}/${total}). Mần lại!`;
        }
        
        document.getElementById("submitBtn").style.display = "none";
        document.getElementById("startBtn").style.display = "block";
        document.getElementById("startBtn").innerText = "Mần lại bài";

        // Ghi lịch sử
        const examName = document.getElementById("examSelect").options[document.getElementById("examSelect").selectedIndex].text;
        saveHistory(examName, score, total, score >= passScore);
    }

    function saveHistory(examName, score, total, isPass) {
        let history = JSON.parse(localStorage.getItem("b1_120_history")) || [];
        const now = new Date();
        const dateStr = now.toLocaleDateString('vi-VN') + " " + now.toLocaleTimeString('vi-VN');
        
        const newRecord = {
            exam: examName,
            date: dateStr,
            score: `${score}/${total}`,
            status: isPass ? "ĐẠT" : "TRƯỢT"
        };
        
        history.unshift(newRecord);
        localStorage.setItem("b1_120_history", JSON.stringify(history));
        renderHistory();
    }

    function renderHistory() {
        const historyBody = document.getElementById("historyBody");
        let history = JSON.parse(localStorage.getItem("b1_120_history")) || [];
        
        historyBody.innerHTML = "";
        
        if (history.length === 0) {
            historyBody.innerHTML = `<tr><td colspan="4">Nỏ có dự liệu thi, cắp đít mần một bài đi</td></tr>`;
            return;
        }

        history.forEach(record => {
            const tr = document.createElement("tr");
            const statusClass = record.status === "ĐẠT" ? "status-pass" : "status-fail";
            // Check nếu bản ghi cũ chưa có trường exam
            const examLabel = record.exam ? record.exam : "Đề cũ";
            
            tr.innerHTML = `
                <td>${examLabel}</td>
                <td>${record.date}</td>
                <td>${record.score}</td>
                <td class="${statusClass}">${record.status}</td>
            `;
            historyBody.appendChild(tr);
        });
    }

    function clearHistory() {
        if(confirm("Xóa sạch lịch sử làm bài?")) {
            localStorage.removeItem("b1_120_history");
            renderHistory();
        }
    }
</script>
